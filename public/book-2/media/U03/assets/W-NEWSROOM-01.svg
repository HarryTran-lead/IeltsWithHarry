<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="633" viewBox="0 0 1080 633" role="img"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#117b87"/></marker></defs><rect width="1080" height="633" fill="#f8fbfd"/><text x="35" y="48" font-family="Arial" font-size="26" fill="#14536c" font-weight="bold">How a community news website prepares a verified story</text><text x="35" y="80" font-family="Arial" font-size="15" fill="#6a7b83">Independent practice diagram; follow the arrows from Stage 1 to the final stage.</text><rect x="45" y="107" width="975" height="60" rx="12" fill="#e8f7f1" stroke="#b4d7db"/><circle cx="89" cy="137" r="20" fill="#17738b"/><text x="89" y="144" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">1</text><text x="140" y="133" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">Tip received by editor</text><text x="140" y="155" font-family="Arial" font-size="14" fill="#576e7a">Community tip line</text><path d="M530 169 v9" stroke="#117b87" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="180" width="975" height="60" rx="12" fill="#e7f2fa" stroke="#b4d7db"/><circle cx="89" cy="210" r="20" fill="#17738b"/><text x="89" y="217" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">2</text><text x="140" y="206" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">Source and time verified</text><text x="140" y="228" font-family="Arial" font-size="14" fill="#576e7a">Reporting team</text><path d="M530 242 v9" stroke="#117b87" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="253" width="975" height="60" rx="12" fill="#e8f7f1" stroke="#b4d7db"/><circle cx="89" cy="283" r="20" fill="#17738b"/><text x="89" y="290" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">3</text><text x="140" y="279" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">People interviewed and facts checked</text><text x="140" y="301" font-family="Arial" font-size="14" fill="#576e7a">Journalists</text><path d="M530 315 v9" stroke="#117b87" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="326" width="975" height="60" rx="12" fill="#e7f2fa" stroke="#b4d7db"/><circle cx="89" cy="356" r="20" fill="#17738b"/><text x="89" y="363" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">4</text><text x="140" y="352" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">Draft written and images licensed</text><text x="140" y="374" font-family="Arial" font-size="14" fill="#576e7a">Writer</text><path d="M530 388 v9" stroke="#117b87" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="399" width="975" height="60" rx="12" fill="#e8f7f1" stroke="#b4d7db"/><circle cx="89" cy="429" r="20" fill="#17738b"/><text x="89" y="436" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">5</text><text x="140" y="425" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">Editor reviews accuracy and wording</text><text x="140" y="447" font-family="Arial" font-size="14" fill="#576e7a">Senior editor</text><path d="M530 461 v9" stroke="#117b87" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="472" width="975" height="60" rx="12" fill="#e7f2fa" stroke="#b4d7db"/><circle cx="89" cy="502" r="20" fill="#17738b"/><text x="89" y="509" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">6</text><text x="140" y="498" font-family="Arial" font-size="18" fill="#233b4d" font-weight="bold">Article published and corrections monitored</text><text x="140" y="520" font-family="Arial" font-size="14" fill="#576e7a">Website team</text></svg>