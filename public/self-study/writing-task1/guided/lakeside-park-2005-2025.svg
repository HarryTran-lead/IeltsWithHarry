<title id="t">Lakeside Park in 2005 and 2025</title><desc id="d">Two labelled schematic maps. In 2025, the pond and south entrance remain, woodland becomes a café, the car park becomes bicycle racks, a central pavilion is introduced, the playground expands, and an east gate is added.</desc>
