name: Quality
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: node scripts/speaking-s6-l29-release-gate.mjs
      - run: node scripts/speaking-s6-l30-staging-preflight.mjs
      - run: node scripts/speaking-s6-l31-device-evidence.mjs
      - run: node scripts/speaking-s6-l32-defect-triage.mjs
      - run: node scripts/speaking-s6-l33-teacher-review.mjs
      - run: node scripts/speaking-s6-l33-batch-audit.mjs
      - run: node scripts/speaking-s6-l34-editorial-remediation.mjs
      - run: node scripts/speaking-s6-l35-source-intake.mjs
      - run: node scripts/speaking-s6-l36-correction-packaging.mjs
      - run: npm run build
  audio-worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy soundfile requests imageio-ffmpeg
      - run: python -m unittest discover -s services/audio-worker -p 'test_*.py' -v
