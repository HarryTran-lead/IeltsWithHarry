name: H73 Static Privileged Source Surface Gate
on:
  push:
    branches:
      - codex/r19-h73-service-role-reachability-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h73-privileged-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed privileged source inventory
        run: python3 -m unittest discover -s tests -p 'test_h73_*.py' -v
      - name: Verify that private worker entrypoints receive runtime classification
        run: python3 -m unittest discover -s tests -p 'test_h72_dependency_audit.py' -v
      - name: Verify SHA and reject unreviewed service-role or bankClient paths
        run: |
          python3 scripts/h73_privilege_surface_gate.py \
            --repo . --expected-sha "$GITHUB_SHA" \
            --json-out reports/h73_privilege_surface.json
      - name: Verify Cloudflare, Vercel, Docker, RPC and cron source boundaries (H73/M05)
        run: |
          python3 scripts/h73_m05_runtime_boundary_gate.py \
            --repo . --expected-sha "$GITHUB_SHA" \
            --json-out reports/h73_m05_runtime_boundaries.json
      - name: Assert runtime boundary evidence remains STATIC ONLY
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open("reports/h73_m05_runtime_boundaries.json"))
          assert report["status"]=="STATIC_BOUNDARY_MATCH"
          assert report["issues"]==[]
          assert report["release_gate"]=="NO_GO"
          assert report["deployment_verified"] is False
          assert report["supabase_staging_verified"] is False
          PY
      - name: Assert this is NOT a staging or release attestation
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('reports/h73_privilege_surface.json'))
          assert data['status']=='STATIC_BASELINE_MATCH'
          assert data['release_gate']=='NO_GO'
          assert data['supabase_staging_verified'] is False
          assert data['source_coverage_complete'] is True
          assert len(data['observed_role_paths']) == 12
          assert len(data['observed_possible_client_paths']) == 22
          assert len(data['observed_indirect_bank_client_paths']) == 21
          assert len(set(data['observed_role_paths']) | set(data['observed_possible_client_paths'])) == 33
          assert data['unreviewed_new_role_paths'] == []
          assert data['unreviewed_new_client_paths'] == []
          assert data['stale_baseline_paths'] == []
          assert data['stale_client_baseline_paths'] == []
          PY
      - name: Preserve diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h73-privileged-source-static-report
          retention-days: 7
          if-no-files-found: warn
          path: |
            reports/h73_privilege_surface.json
            reports/h73_m05_runtime_boundaries.json
            scripts/h73_m05_runtime_boundary_gate.py
            tests/test_h73_m05_runtime_boundary_gate.py
            scripts/h73_privilege_surface_gate.py
            tests/test_h73_privilege_surface_gate.py
            docs/R19_H73_PRIVILEGED_SOURCE_REVIEW_VI.md
