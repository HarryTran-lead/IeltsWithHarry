name: H69 H58-Accurate Teacher Auth/RLS Contract
on:
  push:
    branches:
      - codex/r19-h69-supabase-auth-rls-evidence-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h69-postgres-16:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h69_ci_runner
          POSTGRES_PASSWORD: h69_ci_password_only
          POSTGRES_DB: h69_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure psql exists
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Verify 3 independent teachers, RLS grants, idempotency and H58 immutable ledger on isolated PostgreSQL 16
        run: bash scripts/h69_ci_postgres.sh
        env:
          H69_ALLOW_EPHEMERAL_DDL: YES_ISOLATED_CI_ONLY
          H69_PG_DSN: postgresql://h69_ci_runner:h69_ci_password_only@127.0.0.1:5432/h69_ci
      - name: Package H69 source patch for independent audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h69-source-patch
          retention-days: 7
          if-no-files-found: error
          path: |
            .github/workflows/h69-postgres-auth-rls-contract-ci.yml
            sql/h69_ci_h58_blueprint.sql
            sql/h69_dba_readonly_inventory.sql
            scripts/h69_ci_bootstrap.sql
            scripts/h69_ci_postgres.sh
            scripts/h69_supabase_staging_readonly.mjs
            src/app/api/admin/r19/h68/review/route.h69.test.ts
            docs/R19_H69_CODEX_STAGING_VALIDATION_VI.md
            evidence/H69_STAGING_EVIDENCE_TEMPLATE.json
