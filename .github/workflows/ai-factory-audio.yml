name: AI Factory audio

on:
  schedule:
    # Allow the full daily text set to finish before rendering its four audio parts.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-factory-audio
  cancel-in-progress: false

jobs:
  render-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.AI_FACTORY_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_FACTORY_SERVICE_ROLE_KEY }}
      AUDIO_CACHE_DIR: /tmp/ai-factory-audio
      ASR_ENABLED: "true"
    steps:
      - name: Check private configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Audio worker not configured; no production job was claimed."
          fi
      - name: Check audio queue before installing model dependencies
        id: queue
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"select": "id", "kind": "eq.listening_audio", "status": "in.(queued,running)", "limit": "1"})
          request = urllib.request.Request(
              os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/ai_factory_jobs?" + query,
              headers={"apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"], "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"]},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              pending = bool(json.load(response))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("pending=" + str(pending).lower() + "\n")
          print("Audio queue has work" if pending else "Audio queue is empty")
          PY
      - uses: actions/checkout@v4
        if: steps.queue.outputs.pending == 'true'
      - uses: actions/setup-python@v5
        if: steps.queue.outputs.pending == 'true'
        with:
          python-version: '3.11'
      - name: Install Kokoro dependencies
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
          python -m pip install --no-cache-dir -r services/audio-worker/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Process the queued audio drafts (up to three per run)
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            output=$(python services/audio-worker/worker.py --once)
            echo "$output"
            if grep -q '"status": "idle"' <<< "$output"; then break; fi
          done
