name: AI Factory audio

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-factory-audio
  cancel-in-progress: false

jobs:
  render-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.AI_FACTORY_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AI_FACTORY_SERVICE_ROLE_KEY }}
      AUDIO_CACHE_DIR: ${{ runner.temp }}/ai-factory-audio
      ASR_ENABLED: "true"
    steps:
      - name: Check private configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Audio worker not configured; no production job was claimed."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: '3.11'
      - name: Install Kokoro dependencies
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
          python -m pip install --no-cache-dir -r services/audio-worker/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Process one queued audio draft
        if: steps.config.outputs.configured == 'true'
        run: python services/audio-worker/worker.py --once
