name: H74 Isolated Auth RLS and RPC Security Contracts
on:
  push:
    branches:
      - codex/r19-h74-auth-rls-rpc-boundaries-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  h74-isolated-pg16-auth-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h74_ci_runner
          POSTGRES_PASSWORD: h74_ci_password_only
          POSTGRES_DB: h74_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify fail-closed preflight and existing auth owner checks
        run: python3 -m unittest discover -s tests -p 'test_h74_*.py' -v
      - name: Ensure psql is installed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Exercise isolated PostgreSQL 16 RLS and RPC security contracts
        run: bash scripts/h74_ci_pg_auth_rls.sh
        env:
          H74_ALLOW_EPHEMERAL_DDL: YES_ISOLATED_PG16_CI_ONLY
          H74_PG_DSN: postgresql://h74_ci_runner:h74_ci_password_only@127.0.0.1:5432/h74_ci
      - name: Assert live staging remains untested and NO_GO
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/H71_STAGING_EVIDENCE_TEMPLATE.json'))
          assert len(d['checks']) == 18
          assert all(item['status'] == 'NOT_TESTED' for item in d['checks'])
          assert d['classification'] == 'NON_ATTESTED_TEMPLATE'
          assert d['release_gate'] == 'NO_GO'
          PY
      - name: Preserve source and isolated CI logs for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h74-isolated-auth-rls-rpc-source
          retention-days: 7
          if-no-files-found: warn
          path: |
            .github/workflows/h74-auth-rls-rpc-ci.yml
            scripts/h74_ci_pg_auth_rls.sh
            scripts/h74_staging_two_user_readonly.mjs
            tests/test_h74_staging_preflight.py
            tests/test_h74_auth_rls_boundaries.py
            docs/R19_H74_AUTH_RLS_RPC_TECHNICAL_VI.md
