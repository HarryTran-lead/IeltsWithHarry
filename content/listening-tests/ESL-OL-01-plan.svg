<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>Harbour Heritage Centre – ground floor (Questions 16–20)</title>
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="26" font-size="17" font-weight="bold" fill="#1d3557" text-anchor="middle">Harbour Heritage Centre – Ground floor</text>
  <!-- Building outline with the entrance gap in the south wall -->
  <path d="M330 410 L40 410 L40 44 L680 44 L680 410 L390 410" fill="#f4f7fa" stroke="#1d3557" stroke-width="4"/>
  <!-- Rooms -->
  <g fill="#ffffff" stroke="#5b7286" stroke-width="2">
    <rect x="58" y="62" width="176" height="96" rx="6"/>
    <rect x="272" y="62" width="176" height="96" rx="6"/>
    <rect x="486" y="62" width="176" height="96" rx="6"/>
    <rect x="58" y="188" width="176" height="100" rx="6"/>
    <rect x="486" y="188" width="176" height="100" rx="6"/>
    <rect x="58" y="318" width="120" height="76" rx="6"/>
    <rect x="276" y="318" width="50" height="76" rx="6"/>
    <rect x="486" y="318" width="176" height="76" rx="6"/>
  </g>
  <!-- Atrium, stairs, reception -->
  <rect x="272" y="188" width="176" height="100" rx="10" fill="#dde8f1" stroke="#8aa3b8" stroke-width="1.5"/>
  <text x="360" y="243" font-size="14" fill="#3f5a72" text-anchor="middle" letter-spacing="2">ATRIUM</text>
  <rect x="190" y="318" width="74" height="76" fill="#e9e4da" stroke="#a39783"/>
  <g stroke="#a39783" stroke-width="1.2">
    <line x1="190" y1="333" x2="264" y2="333"/><line x1="190" y1="348" x2="264" y2="348"/><line x1="190" y1="363" x2="264" y2="363"/><line x1="190" y1="378" x2="264" y2="378"/>
  </g>
  <text x="227" y="410" font-size="12" fill="#5d5340" text-anchor="middle" dy="-2">Stairs</text>
  <rect x="400" y="330" width="70" height="40" rx="4" fill="#fdf0d5" stroke="#c49a49"/>
  <text x="435" y="355" font-size="12" fill="#6b4e16" text-anchor="middle">Reception</text>
  <!-- Entrance -->
  <path d="M360 452 L360 418" stroke="#1f7a5c" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a5c"/></marker></defs>
  <text x="360" y="466" font-size="12" fill="#1f7a5c" text-anchor="middle" letter-spacing="2">ENTRANCE</text>
  <!-- Compass -->
  <g transform="translate(694 74)"><path d="M0 -22 L7 4 L0 -2 L-7 4 Z" fill="#1d3557"/><text y="20" font-size="12" font-weight="bold" fill="#1d3557" text-anchor="middle">N</text></g>
  <!-- Letters -->
  <g font-size="26" font-weight="bold" fill="#1d3557" text-anchor="middle">
    <text x="146" y="120">A</text>
    <text x="360" y="120">B</text>
    <text x="574" y="120">C</text>
    <text x="146" y="248">D</text>
    <text x="574" y="248">E</text>
    <text x="118" y="366">F</text>
    <text x="301" y="366">H</text>
    <text x="574" y="366">G</text>
  </g>
</svg>
